notes:
  execution_rules:
    - docs/status/roadmap-state.yaml 是 linear parity cron 的唯一恢复状态源；task-board 是 lane 明细与后继任务定义源。
    - 每轮先检查 git status/branch/head/log，再读取本状态文件、task-board 与 roadmap。
    - 每次只执行一个 execution unit；完成或阻塞后必须写回状态，并立即停止。
    - Implementation 完成闭环顺序：feature/work commit → 记录 hash → 更新状态/task-board/logbook/worktime → docs/state commit → 检查工作区干净 → push。
    - Capture 完成闭环顺序：证据产物落盘 → 更新状态/task-board/logbook/worktime → 如需状态提交则单独提交 → stop。
  next_run_prompt_summary: >-
    恢复本状态文件，优先只处理当前 lane 对应的 current_task；若是 capture 则继续 CAP-08 的同一入口校验/反馈态只读采集，若是 implementation 则根据 task-board 只推进 IMP-17 的一个最小可交付增量；完成或阻塞后必须写回状态并停止。
